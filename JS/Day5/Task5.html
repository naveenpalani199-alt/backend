<body>

    <script>
        const cart = [
        { name: "Laptop", price: 60000, quantity: 1 },
        { name: "Mouse", price: 500, quantity: 2 },
        { name: "Keyboard", price: 1500, quantity: 1 }
     ];

      const total = cart.reduce((sum, item) => {
          return sum + item.price * item.quantity;
      }, 0);

      console.log(total);
    </script>
